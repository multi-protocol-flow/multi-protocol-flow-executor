# Mosquitto MQTT Broker 配置 — 用于 flow-engine 集成测试
# 允许无认证连接，适合测试环境

# 持久化
persistence false

# 日志
log_dest stdout
log_type all
connection_messages true

# 认证 (测试环境: 允许匿名)
allow_anonymous true

# TCP 监听
listener 1883
protocol mqtt

# WebSocket 监听
listener 8086
protocol websockets

# 最大连接数
max_connections -1

# 最大保持消息数
max_queued_messages 100

# Keepalive 范围
max_keepalive 3600
