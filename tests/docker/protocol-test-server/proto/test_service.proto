// gRPC 测试服务定义
// 覆盖四种通信模式: Unary / Server Streaming / Client Streaming / Bidi Streaming

syntax = "proto3";

package testserver;

// ============================================================
// 通用测试服务
// ============================================================

service TestService {
  // --- Unary RPCs ---
  
  /// 简单问候
  rpc SayHello(HelloRequest) returns (HelloResponse);
  
  /// 原样回显消息
  rpc Echo(EchoRequest) returns (EchoResponse);
  
  /// 四则运算
  rpc Calculate(CalcRequest) returns (CalcResponse);

  // --- Server Streaming ---
  
  /// 服务端流式响应：返回 count 次 EchoResponse
  rpc ServerStream(StreamRequest) returns (stream StreamResponse);

  // --- Client Streaming ---
  
  /// 客户端流式请求：汇总收到的所有消息
  rpc ClientStream(stream StreamRequest) returns (StreamSummary);

  // --- Bidi Streaming ---
  
  /// 双向流：每收到一条消息就回一条
  rpc BidiStream(stream StreamRequest) returns (stream StreamResponse);
}

// ============================================================
// 消息定义
// ============================================================

message HelloRequest {
  string name = 1;
}

message HelloResponse {
  string message = 1;
}

message EchoRequest {
  string message = 1;
}

message EchoResponse {
  string message = 1;
}

message CalcRequest {
  double a = 1;
  double b = 2;
  string operation = 3; // add, subtract, multiply, divide
}

message CalcResponse {
  double result = 1;
  string operation = 2;
  string error = 3; // 非空表示计算错误 (如除零)
}

message StreamRequest {
  string message = 1;
  int32 sequence = 2;
}

message StreamResponse {
  string message = 1;
  int32 sequence = 2;
  int64 timestamp_ms = 3; // Unix 时间戳 (毫秒)
}

message StreamSummary {
  int32 message_count = 1;
  string concatenated = 2; // 所有消息用逗号拼接
}
