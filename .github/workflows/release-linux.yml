name: Release - Linux CLI

on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}

    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable

      - uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Set version
        id: version
        run: echo "version=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"

      - name: Inject version from tag
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          sed -i "s/^version = \"[^\"]*\"/version = \"$VERSION\"/" src-tauri/Cargo.toml
          sed -i "s/^version = \"[^\"]*\"/version = \"$VERSION\"/" src-tauri/crates/mpe-cli/Cargo.toml

      - name: Build mpe-cli
        run: cd src-tauri && cargo build -p mpe-cli --release

      - name: Package
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          cd src-tauri/target/release
          mv mpe-cli mpe
          tar czf "mpe-v${VERSION}-linux-x86_64.tar.gz" mpe

      - name: Upload to R2
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          AWS_DEFAULT_REGION: auto
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          R2_ENDPOINT="https://${{ secrets.R2_ACCOUNT_ID }}.r2.cloudflarestorage.com"
          aws s3 cp src-tauri/target/release/mpe-v${VERSION}-linux-x86_64.tar.gz \
            "s3://${{ secrets.R2_BUCKET }}/releases/v${VERSION}/mpe-v${VERSION}-linux-x86_64.tar.gz" \
            --endpoint-url $R2_ENDPOINT

  manifest:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Update release manifest
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          AWS_DEFAULT_REGION: auto
          R2_ENDPOINT: https://${{ secrets.R2_ACCOUNT_ID }}.r2.cloudflarestorage.com
          R2_BUCKET: ${{ secrets.R2_BUCKET }}
        run: |
          bash .github/scripts/update-manifest.sh \
            linux \
            "${{ needs.build.outputs.version }}" \
            "$R2_ENDPOINT" \
            "$R2_BUCKET"
