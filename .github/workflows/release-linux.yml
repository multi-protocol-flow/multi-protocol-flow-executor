name: Release - Linux CLI (musl static)

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Release version (e.g. 0.1.2 or v0.1.2)'
        required: true
permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    container:
      image: alpine:3.21
    outputs:
      version: ${{ steps.version.outputs.version }}

    steps:
      - uses: actions/checkout@v7

      - name: Install system dependencies
        run: |
          apk add --no-cache \
            curl bash git gcc musl-dev cmake make g++ \
            openssl-dev openssl-libs-static \
            perl curl-dev zlib-dev zlib-static \
            aws-cli

      - uses: actions/cache@v4
        id: cargo-cache
        with:
          path: |
            /root/.cargo/bin
            /root/.cargo/registry
          key: musl-cargo-${{ hashFiles('src-tauri/Cargo.lock') }}
          restore-keys: musl-cargo-

      - uses: actions/cache@v4
        with:
          path: src-tauri/target
          key: musl-target-${{ hashFiles('src-tauri/Cargo.lock') }}
          restore-keys: musl-target-

      - name: Install Rust
        run: |
          export CARGO_HOME="$HOME/.cargo"
          export RUSTUP_HOME="$HOME/.rustup"
          if [ ! -f "$CARGO_HOME/bin/cargo" ]; then
            curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs | bash -s -- -y
          fi
          echo "$CARGO_HOME/bin" >> "$GITHUB_PATH"
          echo "CARGO_HOME=$CARGO_HOME" >> "$GITHUB_ENV"
          echo "RUSTUP_HOME=$RUSTUP_HOME" >> "$GITHUB_ENV"

      - name: Debug - verify cargo
        run: |
          echo "HOME=$HOME"
          ls -la "$HOME/.cargo/bin/" 2>/dev/null || echo "no .cargo/bin"
          which cargo 2>/dev/null || echo "cargo not in PATH"
          cargo --version 2>/dev/null || echo "cargo not found"

      - name: Set version
        id: version
        run: |
          VERSION="${{ inputs.version }}"
          VERSION="${VERSION#v}"
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"

      - name: Inject version
        run: |
          VERSION="${{ steps.version.outputs.version }}"
          sed -i "s/^version = \"[^\"]*\"/version = \"$VERSION\"/" src-tauri/Cargo.toml
          sed -i "s/^version = \"[^\"]*\"/version = \"$VERSION\"/" src-tauri/crates/mpe-cli/Cargo.toml
      - name: Build mpe-cli (musl static)
        run: |
          cd src-tauri && cargo build -p mpe-cli --release

      - name: Package
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          cd src-tauri/target/release
          mv mpe-cli mpe
          tar czf "mpe-v${VERSION}-linux-x86_64.tar.gz" mpe

      - name: Upload to R2
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          AWS_DEFAULT_REGION: auto
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          R2_ENDPOINT="https://${{ secrets.R2_ACCOUNT_ID }}.r2.cloudflarestorage.com"
          aws s3 cp src-tauri/target/release/mpe-v${VERSION}-linux-x86_64.tar.gz \
            "s3://${{ secrets.R2_BUCKET }}/releases/v${VERSION}/mpe-v${VERSION}-linux-x86_64.tar.gz" \
            --endpoint-url $R2_ENDPOINT

  manifest:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Update release manifest
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          AWS_DEFAULT_REGION: auto
          R2_ENDPOINT: https://${{ secrets.R2_ACCOUNT_ID }}.r2.cloudflarestorage.com
          R2_BUCKET: ${{ secrets.R2_BUCKET }}
        run: |
          bash .github/scripts/update-manifest.sh \
            linux \
            "${{ needs.build.outputs.version }}" \
            "$R2_ENDPOINT" \
            "$R2_BUCKET"
