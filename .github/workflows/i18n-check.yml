name: "i18n Check — Backend"

# ADVISORY: the backend still contains ~1.8k lines of Chinese string literals
# (storage.rs, http_executor.rs, debug/executor.rs, ...). This check reports
# them but does not fail the build, so it does not block every PR touching
# `src-tauri/**/*.rs`. Remove the `exit 0` (and flip the step to fail) once the
# backlog is cleared.

on:
  push:
    branches: [master]
    paths:
      - 'src-tauri/**/*.rs'
      - '.github/workflows/i18n-check.yml'
  pull_request:
    branches: [master]
    paths:
      - 'src-tauri/**/*.rs'
      - '.github/workflows/i18n-check.yml'

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  i18n-check:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Install ripgrep
        run: sudo apt-get update && sudo apt-get install -y ripgrep

      - name: Check for Chinese text in Rust backend code
        run: |
          # A directory scan emits `path:line:content`, so the comment filter has
          # to match that prefix — `^\s*//` matches nothing here.
          rg \
            -g '*.rs' \
            -g '!target/' \
            -g '!.git/' \
            -g '!**/tests/' \
            -n -H \
            '[\u4e00-\u9fff]' \
            src-tauri/ \
          | rg -v '^[^:]+:[0-9]+:\s*(//|///|//!)' \
          > /tmp/i18n-issues.txt || true

          COUNT=$(wc -l < /tmp/i18n-issues.txt)

          {
            echo "## i18n Check — Backend"
            echo ""
            if [ "$COUNT" -eq 0 ]; then
              echo "✅ No Chinese text in backend Rust code outside comments."
            else
              echo "⚠️ ${COUNT} line(s) with Chinese text outside comments. Advisory only."
              echo ""
              echo "<details><summary>First 100 lines</summary>"
              echo ""
              echo '```'
              head -100 /tmp/i18n-issues.txt
              echo '```'
              echo ""
              echo "</details>"
            fi
          } >> "$GITHUB_STEP_SUMMARY"

          if [ "$COUNT" -gt 0 ]; then
            echo "::warning title=Backend i18n::$COUNT line(s) with Chinese text outside comments"
          fi
