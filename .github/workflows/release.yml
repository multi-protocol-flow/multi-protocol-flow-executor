name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
      - uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
      - run: npm ci
      - run: npm run typesafe-i18n
      - name: Build + Sign
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          args: --bundles nsis
      - name: Upload to R2
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          AWS_DEFAULT_REGION: auto
        run: |
          $VERSION = "${{ github.ref_name }}" -replace '^v', ''
          $R2_ENDPOINT = "https://${{ secrets.R2_ACCOUNT_ID }}.r2.cloudflarestorage.com"
          aws s3 cp src-tauri/target/release/bundle/nsis/*.exe s3://${{ secrets.R2_BUCKET }}/releases/v$VERSION/mpe-$VERSION-x64-setup.exe --endpoint-url $R2_ENDPOINT
          aws s3 cp src-tauri/target/release/bundle/nsis/*.exe.sig s3://${{ secrets.R2_BUCKET }}/releases/v$VERSION/mpe-$VERSION-x64-setup.exe.sig --endpoint-url $R2_ENDPOINT

  build-macos:
    runs-on: macos-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
      - uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
      - run: npm ci
      - run: npm run typesafe-i18n
      - name: Build + Sign
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          args: --bundles dmg
      - name: Upload to R2
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          AWS_DEFAULT_REGION: auto
        run: |
          VERSION=$(echo "${{ github.ref_name }}" | sed 's/^v//')
          R2_ENDPOINT="https://${{ secrets.R2_ACCOUNT_ID }}.r2.cloudflarestorage.com"
          aws s3 cp src-tauri/target/release/bundle/dmg/*.dmg s3://${{ secrets.R2_BUCKET }}/releases/v$VERSION/mpe-$VERSION-universal.dmg --endpoint-url $R2_ENDPOINT
          aws s3 cp src-tauri/target/release/bundle/dmg/*.dmg.sig s3://${{ secrets.R2_BUCKET }}/releases/v$VERSION/mpe-$VERSION-universal.dmg.sig --endpoint-url $R2_ENDPOINT || true

  update-manifest:
    runs-on: ubuntu-latest
    needs: [build-windows, build-macos]
    steps:
      - uses: actions/checkout@v4
      - name: Generate manifest.json
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          AWS_DEFAULT_REGION: auto
        run: |
          VERSION=$(echo "${{ github.ref_name }}" | sed 's/^v//')
          R2_ENDPOINT="https://${{ secrets.R2_ACCOUNT_ID }}.r2.cloudflarestorage.com"
          R2_BUCKET="${{ secrets.R2_BUCKET }}"
          aws s3 cp s3://$R2_BUCKET/releases/v$VERSION/mpe-$VERSION-x64-setup.exe.sig /tmp/win.sig --endpoint-url $R2_ENDPOINT
          aws s3 cp s3://$R2_BUCKET/releases/v$VERSION/mpe-$VERSION-universal.dmg.sig /tmp/mac.sig --endpoint-url $R2_ENDPOINT || true
          WIN_SIG=$(cat /tmp/win.sig 2>/dev/null || echo "")
          MAC_SIG=$(cat /tmp/mac.sig 2>/dev/null || echo "")
          cat > /tmp/manifest.json << MANIFEST
          {
            "version": "$VERSION",
            "notes": "Release v$VERSION",
            "pub_date": "$(date -u +%Y-%m-%dT%H:%M:%SZ)",
            "platforms": {
              "windows-x86_64": {
                "signature": "$WIN_SIG",
                "url": "https://mpe-downloads.sunanzhi.com/releases/v$VERSION/mpe-$VERSION-x64-setup.exe"
              },
              "darwin-aarch64": {
                "signature": "$MAC_SIG",
                "url": "https://mpe-downloads.sunanzhi.com/releases/v$VERSION/mpe-$VERSION-universal.dmg"
              },
              "darwin-x86_64": {
                "signature": "$MAC_SIG",
                "url": "https://mpe-downloads.sunanzhi.com/releases/v$VERSION/mpe-$VERSION-universal.dmg"
              }
            }
          }
          MANIFEST
          aws s3 cp /tmp/manifest.json s3://$R2_BUCKET/manifest.json --endpoint-url $R2_ENDPOINT --cache-control "no-cache, must-revalidate"
