name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
      - uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
      - name: Inject version from tag
        shell: bash
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          echo "Injecting version: $VERSION"
          node -e "
          const fs = require('fs');
          const version = '$VERSION';
          // package.json
          let pkg = JSON.parse(fs.readFileSync('package.json', 'utf8'));
          pkg.version = version;
          fs.writeFileSync('package.json', JSON.stringify(pkg, null, 2) + '\n');
          // tauri.conf.json
          let tauri = JSON.parse(fs.readFileSync('src-tauri/tauri.conf.json', 'utf8'));
          tauri.version = version;
          fs.writeFileSync('src-tauri/tauri.conf.json', JSON.stringify(tauri, null, 2) + '\n');
          // Cargo.toml
          let cargo = fs.readFileSync('src-tauri/Cargo.toml', 'utf8');
          cargo = cargo.replace(/(\[package\][\s\S]*?version = )\"[^\"]*\"/, '\$1\"' + version + '\"');
          fs.writeFileSync('src-tauri/Cargo.toml', cargo);
          "
      - run: npm ci
      - run: npm run typesafe-i18n
      - name: Build + Sign
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          tagName: ${{ github.ref_name }}
          releaseName: 'MPE Flow ${{ github.ref_name }}'
          releaseBody: 'See the assets below to download and install.'
          releaseDraft: false
          prerelease: ${{ contains(github.ref_name, 'beta') || contains(github.ref_name, 'alpha') }}
          args: --bundles nsis --config src-tauri/tauri.conf.ci.json
          retryAttempts: 3
      - name: Upload to R2
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          AWS_DEFAULT_REGION: auto
        run: |
          $VERSION = "${{ github.ref_name }}" -replace '^v', ''
          $R2_ENDPOINT = "https://${{ secrets.R2_ACCOUNT_ID }}.r2.cloudflarestorage.com"
          $BUCKET = "${{ secrets.R2_BUCKET }}"
          $EXE = (Get-ChildItem "src-tauri/target/release/bundle/nsis/*.exe" | Select-Object -First 1).FullName
          $SIG = (Get-ChildItem "src-tauri/target/release/bundle/nsis/*.exe.sig" | Select-Object -First 1).FullName
          aws s3 cp "$EXE" "s3://$BUCKET/releases/v$VERSION/mpe-$VERSION-x64-setup.exe" --endpoint-url $R2_ENDPOINT
          aws s3 cp "$SIG" "s3://$BUCKET/releases/v$VERSION/mpe-$VERSION-x64-setup.exe.sig" --endpoint-url $R2_ENDPOINT

  build-macos:
    runs-on: macos-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
      - uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
      - name: Inject version from tag
        shell: bash
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          echo "Injecting version: $VERSION"
          node -e "
          const fs = require('fs');
          const version = '$VERSION';
          // package.json
          let pkg = JSON.parse(fs.readFileSync('package.json', 'utf8'));
          pkg.version = version;
          fs.writeFileSync('package.json', JSON.stringify(pkg, null, 2) + '\n');
          // tauri.conf.json
          let tauri = JSON.parse(fs.readFileSync('src-tauri/tauri.conf.json', 'utf8'));
          tauri.version = version;
          fs.writeFileSync('src-tauri/tauri.conf.json', JSON.stringify(tauri, null, 2) + '\n');
          // Cargo.toml
          let cargo = fs.readFileSync('src-tauri/Cargo.toml', 'utf8');
          cargo = cargo.replace(/(\[package\][\s\S]*?version = )\"[^\"]*\"/, '\$1\"' + version + '\"');
          fs.writeFileSync('src-tauri/Cargo.toml', cargo);
          "
      - run: npm ci
      - run: npm run typesafe-i18n
      - name: Build + Sign
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          tagName: ${{ github.ref_name }}
          releaseName: 'MPE Flow ${{ github.ref_name }}'
          releaseBody: 'See the assets below to download and install.'
          releaseDraft: false
          prerelease: ${{ contains(github.ref_name, 'beta') || contains(github.ref_name, 'alpha') }}
          args: --target universal-apple-darwin --bundles dmg --config src-tauri/tauri.conf.ci.json
      - name: Upload to R2
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          AWS_DEFAULT_REGION: auto
        run: |
          VERSION=$(echo "${{ github.ref_name }}" | sed 's/^v//')
          R2_ENDPOINT="https://${{ secrets.R2_ACCOUNT_ID }}.r2.cloudflarestorage.com"
          aws s3 cp src-tauri/target/release/bundle/dmg/*.dmg s3://${{ secrets.R2_BUCKET }}/releases/v$VERSION/mpe-$VERSION-universal.dmg --endpoint-url $R2_ENDPOINT
          aws s3 cp src-tauri/target/release/bundle/dmg/*.dmg.sig s3://${{ secrets.R2_BUCKET }}/releases/v$VERSION/mpe-$VERSION-universal.dmg.sig --endpoint-url $R2_ENDPOINT || true

  update-manifest:
    runs-on: ubuntu-latest
    needs: [build-windows, build-macos]
    steps:
      - uses: actions/checkout@v4
      - name: Generate manifest.json
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          AWS_DEFAULT_REGION: auto
        run: |
          VERSION=$(echo "${{ github.ref_name }}" | sed 's/^v//')
          R2_ENDPOINT="https://${{ secrets.R2_ACCOUNT_ID }}.r2.cloudflarestorage.com"
          R2_BUCKET="${{ secrets.R2_BUCKET }}"
          aws s3 cp s3://$R2_BUCKET/releases/v$VERSION/mpe-$VERSION-x64-setup.exe.sig /tmp/win.sig --endpoint-url $R2_ENDPOINT
          aws s3 cp s3://$R2_BUCKET/releases/v$VERSION/mpe-$VERSION-universal.dmg.sig /tmp/mac.sig --endpoint-url $R2_ENDPOINT || true
          WIN_SIG=$(cat /tmp/win.sig 2>/dev/null || echo "")
          MAC_SIG=$(cat /tmp/mac.sig 2>/dev/null || echo "")
          cat > /tmp/manifest.json << MANIFEST
          {
            "version": "$VERSION",
            "notes": "Release v$VERSION",
            "pub_date": "$(date -u +%Y-%m-%dT%H:%M:%SZ)",
            "platforms": {
              "windows-x86_64": {
                "signature": "$WIN_SIG",
                "url": "https://mpe-downloads.sunanzhi.com/releases/v$VERSION/mpe-$VERSION-x64-setup.exe"
              },
              "darwin-aarch64": {
                "signature": "$MAC_SIG",
                "url": "https://mpe-downloads.sunanzhi.com/releases/v$VERSION/mpe-$VERSION-universal.dmg"
              },
              "darwin-x86_64": {
                "signature": "$MAC_SIG",
                "url": "https://mpe-downloads.sunanzhi.com/releases/v$VERSION/mpe-$VERSION-universal.dmg"
              }
            }
          }
          MANIFEST
          aws s3 cp /tmp/manifest.json s3://$R2_BUCKET/manifest.json --endpoint-url $R2_ENDPOINT --cache-control "no-cache, must-revalidate"
      - name: Update changelog.json
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          AWS_DEFAULT_REGION: auto
        run: |
          VERSION=$(echo "${{ github.ref_name }}" | sed 's/^v//')
          R2_ENDPOINT="https://${{ secrets.R2_ACCOUNT_ID }}.r2.cloudflarestorage.com"
          R2_BUCKET="${{ secrets.R2_BUCKET }}"
          # Try to download existing changelog.json
          aws s3 cp s3://$R2_BUCKET/changelog.json /tmp/changelog.json --endpoint-url $R2_ENDPOINT 2>/dev/null || echo "[]" > /tmp/changelog.json
          # Determine if prerelease
          IS_PRERELEASE="false"
          if echo "${{ github.ref_name }}" | grep -qE '(beta|alpha)'; then
            IS_PRERELEASE="true"
          fi
          # Build new release entry
          cat > /tmp/new_entry.json << ENTRY
          {
            "version": "$VERSION",
            "tag": "${{ github.ref_name }}",
            "date": "$(date -u +%Y-%m-%dT%H:%M:%SZ)",
            "notes": "Release v$VERSION",
            "prerelease": $IS_PRERELEASE,
            "downloads": {
              "windows": "https://mpe-downloads.sunanzhi.com/releases/v$VERSION/mpe-$VERSION-x64-setup.exe",
              "macos": "https://mpe-downloads.sunanzhi.com/releases/v$VERSION/mpe-$VERSION-universal.dmg"
            }
          }
          ENTRY
          # Prepend new entry to changelog
          jq -s '.[1] + [.[0]]' /tmp/new_entry.json /tmp/changelog.json > /tmp/changelog_new.json
          aws s3 cp /tmp/changelog_new.json s3://$R2_BUCKET/changelog.json --endpoint-url $R2_ENDPOINT --cache-control "no-cache, must-revalidate"
