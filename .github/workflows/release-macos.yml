name: Release - macOS

on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  build:
    runs-on: macos-latest
    outputs:
      version: ${{ steps.version.outputs.version }}

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-apple-darwin

      - uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Set version
        id: version
        run: echo "version=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"

      - name: Inject version from tag
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          node -e "
          const fs = require('fs');
          const version = '$VERSION';
          let pkg = JSON.parse(fs.readFileSync('package.json', 'utf8'));
          pkg.version = version;
          fs.writeFileSync('package.json', JSON.stringify(pkg, null, 2) + '\n');
          let tauri = JSON.parse(fs.readFileSync('src-tauri/tauri.conf.json', 'utf8'));
          tauri.version = version;
          fs.writeFileSync('src-tauri/tauri.conf.json', JSON.stringify(tauri, null, 2) + '\n');
          let cargo = fs.readFileSync('src-tauri/Cargo.toml', 'utf8');
          cargo = cargo.replace(/(\[package\][\s\S]*?version = )\"[^\"]*\"/, '\$1\"' + version + '\"');
          fs.writeFileSync('src-tauri/Cargo.toml', cargo);
          "

      - run: npm ci
      - run: npm run typesafe-i18n

      - name: Build + Sign
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          tagName: ${{ github.ref_name }}
          releaseName: 'MPE Flow ${{ github.ref_name }}'
          releaseBody: 'See the assets below to download and install.'
          releaseDraft: false
          prerelease: ${{ contains(github.ref_name, 'beta') || contains(github.ref_name, 'alpha') }}
          args: --target universal-apple-darwin --bundles dmg --config src-tauri/tauri.conf.ci.json

      - name: Upload to R2
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          AWS_DEFAULT_REGION: auto
        run: |
          VERSION=$(echo "${{ github.ref_name }}" | sed 's/^v//')
          R2_ENDPOINT="https://${{ secrets.R2_ACCOUNT_ID }}.r2.cloudflarestorage.com"
          aws s3 cp src-tauri/target/universal-apple-darwin/release/bundle/dmg/*.dmg \
            "s3://${{ secrets.R2_BUCKET }}/releases/v$VERSION/mpe-$VERSION-universal.dmg" \
            --endpoint-url $R2_ENDPOINT
          aws s3 cp src-tauri/target/universal-apple-darwin/release/bundle/dmg/*.dmg.sig \
            "s3://${{ secrets.R2_BUCKET }}/releases/v$VERSION/mpe-$VERSION-universal.dmg.sig" \
            --endpoint-url $R2_ENDPOINT || true

  manifest:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Update release manifest
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          AWS_DEFAULT_REGION: auto
          R2_ENDPOINT: https://${{ secrets.R2_ACCOUNT_ID }}.r2.cloudflarestorage.com
          R2_BUCKET: ${{ secrets.R2_BUCKET }}
        run: |
          bash .github/scripts/update-manifest.sh \
            macos \
            "${{ needs.build.outputs.version }}" \
            "$R2_ENDPOINT" \
            "$R2_BUCKET"
