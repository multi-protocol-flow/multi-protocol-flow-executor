name: i18n Check — Frontend

on:
  push:
    branches: [master, dev]
    paths:
      - 'src/components/**/*.ts'
      - 'src/components/**/*.tsx'
      - 'scripts/ci/check-frontend-i18n.py'
      - '.github/workflows/i18n-check-frontend.yml'
  pull_request:
    branches: [master]
    paths:
      - 'src/components/**/*.ts'
      - 'src/components/**/*.tsx'
      - 'scripts/ci/check-frontend-i18n.py'
      - '.github/workflows/i18n-check-frontend.yml'

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  i18n-check:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Run Frontend i18n Hard Gate Check
        run: python3 scripts/ci/check-frontend-i18n.py
