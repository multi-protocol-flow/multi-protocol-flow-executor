name: DCO

on:
  pull_request:
    branches: [master]

permissions:
  contents: read
  pull-requests: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  signoff:
    runs-on: ubuntu-latest
    if: github.actor != 'dependabot[bot]'
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Verify every commit is signed off
        run: |
          base="${{ github.event.pull_request.base.sha }}"
          head="${{ github.event.pull_request.head.sha }}"
          failed=0
          for sha in $(git rev-list "$base..$head"); do
            subject=$(git log -1 --format='%s' "$sha")
            # Merge commits are exempt: GitHub's generated message has no trailer.
            parents=$(git rev-list --parents -n 1 "$sha" | wc -w)
            if [ "$parents" -gt 2 ]; then
              continue
            fi
            if ! git log -1 --format='%B' "$sha" | grep -qiE '^Signed-off-by: .+ <.+>$'; then
              echo "::error::Commit $sha is missing a Signed-off-by trailer: $subject"
              failed=1
            fi
          done
          if [ "$failed" -ne 0 ]; then
            echo "Amend with: git rebase --signoff $base"
            exit 1
          fi
          echo "All commits are signed off."
