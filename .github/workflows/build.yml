name: Build

on:
  push:
    branches: [master, main]
  pull_request:
    branches: [master, main]

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: windows-latest
            label: windows-x64
          # - platform: ubuntu-22.04
          #   label: linux-x64
          - platform: macos-latest
            label: macos-universal

    runs-on: ${{ matrix.platform }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Install Linux dependencies
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf \
            libcurl4-openssl-dev libssl-dev libsasl2-dev cmake pkg-config

      - name: Install frontend dependencies
        run: npm ci

      - name: Generate i18n types
        run: npm run typesafe-i18n

      - name: Build
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload artifacts (Windows)
        if: matrix.platform == 'windows-latest'
        uses: actions/upload-artifact@v4
        with:
          name: mpe-${{ matrix.label }}
          path: |
            src-tauri/target/release/bundle/nsis/*.exe
            src-tauri/target/release/bundle/msi/*.msi
          if-no-files-found: warn

      - name: Upload artifacts (Linux)
        if: matrix.platform == 'ubuntu-22.04'
        uses: actions/upload-artifact@v4
        with:
          name: mpe-${{ matrix.label }}
          path: |
            src-tauri/target/release/bundle/deb/*.deb
            src-tauri/target/release/bundle/appimage/*.AppImage
          if-no-files-found: warn

      - name: Upload artifacts (macOS)
        if: matrix.platform == 'macos-latest'
        uses: actions/upload-artifact@v4
        with:
          name: mpe-${{ matrix.label }}
          path: |
            src-tauri/target/release/bundle/dmg/*.dmg
          if-no-files-found: warn

  test:
    strategy:
      fail-fast: false
      matrix:
        include:
          - label: all-features
            args: --all-features
            hakari_check: true
          - label: no-default-features
            args: --no-default-features
            hakari_check: false
          - label: minimal-set
            args: --no-default-features --features "protocol-http,protocol-db,protocol-script"
            hakari_check: false

    runs-on: ubuntu-22.04

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf \
            libcurl4-openssl-dev libssl-dev libsasl2-dev cmake pkg-config

      - name: Install cargo-hakari
        if: matrix.hakari_check
        run: cargo install cargo-hakari --locked

      - name: Check workspace-hack freshness
        if: matrix.hakari_check
        run: cd src-tauri && cargo hakari generate --diff

      - name: Run cargo test (${{ matrix.label }})
        run: cd src-tauri && cargo test ${{ matrix.args }}
