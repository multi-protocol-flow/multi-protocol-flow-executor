# Workspace 配置
[workspace]
members = [
    "crates/flow-engine",
    "crates/flow-engine-core",
    "crates/flow-engine-http",
    "crates/flow-engine-db",
    "crates/flow-engine-ws",
    "crates/flow-engine-script",
    "crates/flow-engine-assertion",
    "crates/flow-engine-crypto",
    "crates/flow-engine-executor",
    "crates/flow-engine-grpc",
    "crates/flow-engine-imap",
    "crates/flow-engine-mcp",
    "crates/flow-engine-mqtt",
    "crates/flow-engine-tcp",
    "crates/flow-engine-kafka",
    "crates/flow-engine-smtp",
    "crates/flow-engine-sse",
    "crates/flow-engine-graphql",
    "crates/flow-engine-amqp",
]
resolver = "2"

# 共享依赖版本管理
[workspace.dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tokio = { version = "1", features = ["rt", "rt-multi-thread", "macros", "sync", "net", "time", "io-util", "io-std", "signal", "fs"] }
async-trait = "0.1"
uuid = { version = "1.0", features = ["v4", "serde"] }
chrono = "0.4"
log = "0.4"
regex = "1.10"
thiserror = "1.0"
anyhow = "1.0"
lettre = { version = "0.11", default-features = false, features = ["tokio1", "tokio1-rustls", "ring", "webpki-roots", "smtp-transport", "builder", "pool", "hostname"] }
async-imap = { version = "0.11", default-features = false, features = ["runtime-tokio"] }
mail-parser = "0.11"

# Workspace Lint 配置
[workspace.lints.rust]
unsafe_code = "forbid"
missing_docs = "warn"

[workspace.lints.clippy]
# 禁止常见错误
all = { level = "warn", priority = -1 }
correctness = { level = "deny", priority = -1 }
suspicious = { level = "warn", priority = -1 }

# 代码风格
style = { level = "warn", priority = -1 }
complexity = { level = "warn", priority = -1 }
perf = { level = "warn", priority = -1 }

# 文档和可读性
missing_docs_in_private_items = "allow"
doc_markdown = "warn"

# 允许的模式（根据项目实际情况调整）
too_many_arguments = "allow"
type_complexity = "allow"

[package]
name = "app"
version = "0.1.0"
description = "A Tauri App"
authors = ["you"]
license = ""
repository = ""
edition = "2021"
rust-version = "1.77.2"
default-run = "mpe"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
name = "app_lib"
crate-type = ["lib"]

[[bin]]
name = "mpe"
path = "src/main.rs"

[build-dependencies]
tauri-build = { version = "2.5.4", features = [] }

[dependencies]
# 业务逻辑引擎
flow-engine = { path = "crates/flow-engine" }

# TLS 加密后端（HTTP/gRPC 的 rustls 0.23 需要显式安装 CryptoProvider）
rustls = { version = "0.23", features = ["ring"] }

# Tauri 框架
tauri = { version = "2.10.0", features = [] }
tauri-plugin-log = "2"
tauri-plugin-dialog = "2"
tauri-plugin-opener = "2"
tauri-plugin-process = "2"
tauri-plugin-store = "2"
tauri-plugin-updater = "2"

# HTTP 客户端（GraphQL 内省 IPC 命令）
reqwest = { version = "0.13", default-features = false, features = ["json", "form"] }

# 通用依赖
serde_json = "1.0"
serde = { version = "1.0", features = ["derive"] }
log = "0.4"
uuid = { version = "1.0", features = ["v4", "serde"] }
async-trait = "0.1"
tokio = { workspace = true }

# CLI 日志
fern = { version = "0.7", default-features = false }
chrono = "0.4"

# CLI 框架 + 配置解析
clap = { version = "4", features = ["derive"] }
toml = "0.8"

# Windows API（FreeConsole 用于分离控制台）
[target.'cfg(windows)'.dependencies]
windows = { version = "0.58", features = ["Win32_System_Console"] }

[dev-dependencies]
mockito = "1.0"
assert_cmd = "2.0"
predicates = "3"
proptest = "1.4"
wiremock = "0.6"
tempfile = "3.0"
# WebSocket 依赖测试
tokio-tungstenite = { version = "0.28", features = ["rustls-tls-webpki-roots"] }
futures-util = "0.3"

# Release 构建优化（减小二进制体积）
[profile.release]
lto = true            # 跨 crate 链接时优化，消除未使用代码
codegen-units = 1     # 单编译单元，允许更好的内联优化
strip = true          # 剥离调试符号
panic = "abort"       # abort 替代 unwind，减小二进制体积
opt-level = "z"       # 体积优先优化

# Debug 编译优化（不经常修改的重依赖预编译为 O3 加速日常开发）
[profile.dev.package.tonic]
opt-level = 3
[profile.dev.package.prost]
opt-level = 3
[profile.dev.package."fe2o3-amqp"]
opt-level = 3
[profile.dev.package.rdkafka]
opt-level = 3
[profile.dev.package.sqlx]
opt-level = 3
[profile.dev.package.lapin]
opt-level = 3
[profile.dev.package.rmcp]
opt-level = 3
[profile.dev.package.rquickjs]
opt-level = 3
[profile.dev.package."tokio-tungstenite"]
opt-level = 3

[lints.rust]
# 允许 unsafe（FreeConsole 等平台 API 需要）
unsafe_code = "allow"
missing_docs = "warn"

[lints.clippy]
all = { level = "warn", priority = -1 }
correctness = { level = "deny", priority = -1 }
suspicious = { level = "warn", priority = -1 }
style = { level = "warn", priority = -1 }
complexity = { level = "warn", priority = -1 }
perf = { level = "warn", priority = -1 }
missing_docs_in_private_items = "allow"
doc_markdown = "warn"
too_many_arguments = "allow"
type_complexity = "allow"
