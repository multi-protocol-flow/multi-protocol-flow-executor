# Workspace 配置
[workspace]
members = [
    "crates/flow-engine",
    "crates/flow-engine-core",
    "crates/flow-engine-http",
    "crates/flow-engine-db",
    "crates/flow-engine-ws",
    "crates/flow-engine-script",
    "crates/flow-engine-assertion",
    "crates/flow-engine-crypto",
    "crates/flow-engine-executor",
    "crates/flow-engine-grpc",
    "crates/flow-engine-imap",
    "crates/flow-engine-mcp",
    "crates/flow-engine-mqtt",
    "crates/flow-engine-tcp",
    "crates/flow-engine-kafka",
    "crates/flow-engine-smtp",
    "crates/flow-engine-sse",
    "crates/flow-engine-graphql",
    "crates/flow-engine-amqp",
    "crates/flow-engine-redis",
    "crates/mpe-cli",
    "crates/workspace-hack",
]
resolver = "2"

# 共享依赖版本管理
[workspace.dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tokio = { version = "1", features = ["rt", "rt-multi-thread", "macros", "sync", "net", "time", "io-util", "io-std"] }
async-trait = "0.1"
uuid = { version = "1.0", features = ["v4", "serde"] }
chrono = "0.4"
log = "0.4"
regex = "1.10"
thiserror = "1.0"
anyhow = "1.0"
base64 = "0.22"
rustls = { version = "0.23", default-features = false, features = ["ring"] }
webpki-roots = "0.26"
tokio-rustls = "0.26"
futures-util = "0.3"
http = "1"
rustls-pemfile = "2"
jsonpath-rust = "1.0.4"
lettre = { version = "0.11", default-features = false, features = ["tokio1", "tokio1-rustls", "ring", "webpki-roots", "smtp-transport", "builder", "pool", "hostname"] }
async-imap = { version = "0.11", default-features = false, features = ["runtime-tokio"] }
mail-parser = "0.11"

# Workspace Lint 配置
[workspace.lints.rust]
unsafe_code = "forbid"
missing_docs = "warn"

[workspace.lints.clippy]
# 禁止常见错误
all = { level = "warn", priority = -1 }
correctness = { level = "deny", priority = -1 }
suspicious = { level = "warn", priority = -1 }

# 代码风格
style = { level = "warn", priority = -1 }
complexity = { level = "warn", priority = -1 }
perf = { level = "warn", priority = -1 }

# 文档和可读性
missing_docs_in_private_items = "allow"
doc_markdown = "warn"

# 允许的模式（根据项目实际情况调整）
too_many_arguments = "allow"
type_complexity = "allow"

# Unwrap/expect 治理 — unwrap 禁止，expect 警告
unwrap_used = "deny"
expect_used = "warn"

[package]
name = "app"
version = "0.1.1-beta.1"
description = "A Tauri App"
authors = ["you"]
license = ""
repository = ""
edition = "2021"
rust-version = "1.82.0"
default-run = "mpe"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
name = "app_lib"
crate-type = ["lib"]

[[bin]]
name = "mpe"
path = "src/main.rs"

[build-dependencies]
tauri-build = { version = "2.5.4", features = [] }

[dependencies]
# 业务逻辑引擎
flow-engine = { path = "crates/flow-engine" }

# CLI 模式（GUI + CLI 二合一模式依赖 mpe-cli）
mpe-cli = { path = "crates/mpe-cli" }

# TLS 加密后端（HTTP/gRPC 的 rustls 0.23 需要显式安装 CryptoProvider）
rustls = { workspace = true, features = ["ring"] }

# Tauri 框架
tauri = { version = "2.10.0", features = [] }
tauri-plugin-log = "2"
tauri-plugin-dialog = "2"
tauri-plugin-opener = "2"
tauri-plugin-process = "2"
tauri-plugin-store = "2"
tauri-plugin-updater = "2"

# HTTP 客户端（GraphQL 内省 IPC 命令）
reqwest = { version = "0.13", default-features = false, features = ["json", "form"] }

# Redis 连接测试命令
redis = { version = "0.29", features = ["tokio-comp", "connection-manager"] }

# 通用依赖
serde_json = "1.0"
serde = { version = "1.0", features = ["derive"] }
log = "0.4"
uuid = { version = "1.0", features = ["v4", "serde"] }
async-trait = "0.1"
tokio = { workspace = true, features = ["signal"] }

# CLI 日志
fern = { version = "0.7", default-features = false }
chrono = "0.4"

# CLI 框架 + 配置解析
clap = { version = "4", features = ["derive"] }
toml = "0.8"
workspace-hack = { version = "0.1", path = "crates/workspace-hack" }

# 协议特性开关（每个协议对应一个 feature，通过 flow-engine 转发）
[features]
default = ["all-protocols"]
all-protocols = [
    "protocol-http",
    "protocol-db",
    "protocol-ws",
    "protocol-script",
    "protocol-assertion",
    "protocol-grpc",
    "protocol-mcp",
    "protocol-tcp",
    "protocol-mqtt",
    "protocol-kafka",
    "protocol-sse",
    "protocol-graphql",
    "protocol-amqp",
    "protocol-smtp",
    "protocol-imap",
    "protocol-redis",
]
protocol-http = ["flow-engine/protocol-http"]
protocol-db = ["flow-engine/protocol-db"]
protocol-ws = ["flow-engine/protocol-ws"]
protocol-script = ["flow-engine/protocol-script"]
protocol-assertion = ["flow-engine/protocol-assertion"]
protocol-grpc = ["flow-engine/protocol-grpc"]
protocol-mcp = ["flow-engine/protocol-mcp"]
protocol-tcp = ["flow-engine/protocol-tcp"]
protocol-mqtt = ["flow-engine/protocol-mqtt"]
protocol-kafka = ["flow-engine/protocol-kafka"]
protocol-sse = ["flow-engine/protocol-sse"]
protocol-graphql = ["flow-engine/protocol-graphql"]
protocol-amqp = ["flow-engine/protocol-amqp"]
protocol-smtp = ["flow-engine/protocol-smtp"]
protocol-imap = ["flow-engine/protocol-imap"]
protocol-redis = ["flow-engine/protocol-redis"]

# Windows API（FreeConsole 用于分离控制台）
[target.'cfg(windows)'.dependencies]
windows = { version = "0.58", features = ["Win32_System_Console"] }

[dev-dependencies]
mockito = "1.0"
assert_cmd = "2.0"
predicates = "3"
proptest = "1.4"
wiremock = "0.6"
tempfile = "3.0"
# WebSocket 依赖测试
tokio-tungstenite = { version = "0.28", features = ["rustls-tls-webpki-roots"] }
futures-util = { workspace = true }
rustls = { workspace = true, features = ["ring"] }

# Release 构建优化（减小二进制体积）
[profile.release]
lto = true            # 跨 crate 链接时优化，消除未使用代码
codegen-units = 1     # 单编译单元，允许更好的内联优化
strip = true          # 剥离调试符号
panic = "abort"       # abort 替代 unwind，减小二进制体积
opt-level = "z"       # 体积优先优化

# Debug 编译优化（不经常修改的重依赖预编译为 O3 加速日常开发）
[profile.dev.package.tonic]
opt-level = 3
[profile.dev.package.prost]
opt-level = 3
[profile.dev.package."fe2o3-amqp"]
opt-level = 3
[profile.dev.package.rdkafka]
opt-level = 3
[profile.dev.package.sqlx]
opt-level = 3
[profile.dev.package.lapin]
opt-level = 3
[profile.dev.package.rmcp]
opt-level = 3
[profile.dev.package.rquickjs]
opt-level = 3
[profile.dev.package."tokio-tungstenite"]
opt-level = 3
# Tauri 框架链
[profile.dev.package.tauri]
opt-level = 3
[profile.dev.package.tauri-runtime-wry]
opt-level = 3
[profile.dev.package.wry]
opt-level = 3
# HTTP 栈
[profile.dev.package.reqwest]
opt-level = 3
[profile.dev.package.hyper]
opt-level = 3
[profile.dev.package.h2]
opt-level = 3
# TLS 栈
[profile.dev.package.rustls]
opt-level = 3
[profile.dev.package.rustls-webpki]
opt-level = 3
# Tokio 栈
[profile.dev.package.tokio]
opt-level = 3
[profile.dev.package.tokio-util]
opt-level = 3
[profile.dev.package.tokio-stream]
opt-level = 3
[profile.dev.package.tokio-rustls]
opt-level = 3
# 序列化栈
[profile.dev.package.syn]
opt-level = 3
[profile.dev.package.proc-macro2]
opt-level = 3
[profile.dev.package.quote]
opt-level = 3
[profile.dev.package.serde]
opt-level = 3
[profile.dev.package.serde_json]
opt-level = 3
# 编译耗时大户
[profile.dev.package.regex]
opt-level = 3
[profile.dev.package.chrono]
opt-level = 3

# 开发 profile 优化
[profile.dev]
debug = "line-tables-only"      # 保留行号回溯，去掉变量级调试信息
split-debuginfo = "unpacked"    # Windows 上加速链接

[profile.dev.package."*"]
debug = false                   # 依赖项去掉调试符号，加速编译

[lints.rust]
# 允许 unsafe（FreeConsole 等平台 API 需要）
unsafe_code = "allow"
missing_docs = "warn"
