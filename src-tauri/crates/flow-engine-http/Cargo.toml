[package]
name = "flow-engine-http"
version = "0.1.0"
edition = "2021"

[dependencies]
flow-engine-core = { path = "../flow-engine-core" }
async-trait = { workspace = true }
hyper = { version = "1.6", features = ["client", "http1", "http2"] }
hyper-util = { version = "0.1", features = ["client", "client-legacy", "http1", "http2", "tokio"] }
http = "1.3"
http-body-util = "0.1"
tower-service = "0.3"
bytes = "1.10"
tokio-rustls = "0.26"
rustls = { version = "0.23", features = ["ring"] }
rustls-pki-types = "1"
webpki-roots = "0.26"
url = "2.5"
mime_guess = "2.0"
serde = { workspace = true }
serde_json = { workspace = true }
tokio = { workspace = true }
log = { workspace = true }
thiserror = { workspace = true }
base64 = "0.22"
flate2 = "1.1"
rustls-pemfile = "2"
tokio-socks = "0.5"

[lints]
workspace = true
