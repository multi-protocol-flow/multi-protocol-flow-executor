[package]
name = "flow-engine-graphql"
version = "0.1.0"
edition = "2021"

[dependencies]
flow-engine-core = { path = "../flow-engine-core" }
# GraphQL HTTP 客户端（query/mutation/introspection）
reqwest = { version = "0.12", features = ["json", "stream", "multipart"] }
# Workspace 共享依赖
async-trait = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
tokio = { workspace = true }
log = { workspace = true }
chrono = { workspace = true }

[lints]
workspace = true
