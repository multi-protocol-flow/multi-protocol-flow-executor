[package]
name = "mpe-plugin-sdk"
version = "0.1.0"
edition = "2021"
description = "SDK for MPE sidecar plugin authors (Rust); deliberately free of host types"

[dependencies]
# Shared wire contract only. NO flow-engine-core dependency: plugin authors
# must not inherit host types — the SDK is a leaf crate.
mpe-protocol = { path = "../mpe-protocol" }
tokio = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }

# Sample plugin used as the `sdk_plugin_roundtrip` test fixture. Declared as a
# [[bin]] so integration tests can locate it via `env!("CARGO_BIN_EXE_...")`.
[[bin]]
name = "mpe_demo_plugin"
path = "src/bin/demo_plugin.rs"

[lints]
workspace = true
