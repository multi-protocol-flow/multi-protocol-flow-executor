[package]
name = "flow-engine-script"
version = "0.1.0"
edition = "2021"

[dependencies]
flow-engine-core = { path = "../flow-engine-core" }
async-trait = "0.1"
rquickjs = { version = "0.7", features = ["chrono", "array-buffer"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tokio = { version = "1", features = ["full"] }
log = "0.4"
thiserror = "1.0"
chrono = "0.4"

# util API 依赖
base64 = "0.22"
urlencoding = "2.1"
sha2 = "0.10"
md-5 = "0.10"
hmac = "0.12"
hex = "0.4"
uuid = { version = "1.0", features = ["v4", "serde"] }
jsonpath-rust = "1.0.4"

[lints]
workspace = true
