[package]
name = "flow-engine-mqtt"
version = "0.1.0"
edition = "2021"

[dependencies]
flow-engine-core = { path = "../flow-engine-core" }
# MQTT 5.0 客户端（use-rustls-ring 自动安装 ring CryptoProvider）
rumqttc-next = { version = "0.30", default-features = false, features = ["use-rustls-ring", "websocket"] }
# TLS 依赖（自定义 TLS 配置，支持 skip_verify）
rustls = { workspace = true, features = ["logging", "tls12"] }
webpki-roots = { workspace = true }
# Workspace 共享依赖
async-trait = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
tokio = { workspace = true }
log = { workspace = true }
thiserror = { workspace = true }
chrono = { workspace = true }
uuid = { workspace = true }
workspace-hack = { version = "0.1", path = "../workspace-hack" }

[lints]
workspace = true
