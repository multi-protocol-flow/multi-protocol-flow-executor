[package]
name = "flow-engine-ws"
version = "0.1.0"
edition = "2021"

[dependencies]
flow-engine-core = { path = "../flow-engine-core" }
async-trait = "0.1"
tokio-tungstenite = { version = "0.28", features = ["native-tls"] }
futures-util = "0.3"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tokio = { version = "1", features = ["full"] }
log = "0.4"
thiserror = "1.0"
http = "1.3"
chrono = "0.4"
evalexpr = "11.0.0"
regex = "1.10"
serde_json_path = "0.7"

[lints]
workspace = true
