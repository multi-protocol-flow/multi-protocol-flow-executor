[package]
name = "flow-engine-executor"
version = "0.1.0"
edition = "2021"

[dependencies]
flow-engine-core = { path = "../flow-engine-core" }
flow-engine-http = { path = "../flow-engine-http" }
flow-engine-db = { path = "../flow-engine-db" }
flow-engine-ws = { path = "../flow-engine-ws" }
flow-engine-script = { path = "../flow-engine-script" }
flow-engine-assertion = { path = "../flow-engine-assertion" }
flow-engine-crypto = { path = "../flow-engine-crypto" }
async-trait = "0.1"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tokio = { version = "1", features = ["full"] }
chrono = "0.4"
uuid = { version = "1.0", features = ["v4", "serde"] }
evalexpr = "11.0.0"
regex = "1.10"
log = "0.4"
serde_json_path = "0.7"
jsonpath-rust = "1.0.4"
thiserror = "1.0"

[dev-dependencies]
mockito = "1.0"
wiremock = "0.6"
proptest = "1.4"

[lints]
workspace = true
