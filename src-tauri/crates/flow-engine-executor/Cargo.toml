[package]
name = "flow-engine-executor"
version = "0.1.0"
edition = "2021"

[features]
default = ["all-protocols", "plugin-manager"]
all-protocols = [
    "protocol-http",
    "protocol-ws",
    "protocol-script",
    "protocol-assertion",
    "protocol-tcp",
    "protocol-sse",
    "protocol-graphql",
]
protocol-http = ["dep:flow-engine-http"]
protocol-ws = ["dep:flow-engine-ws"]
protocol-script = ["dep:flow-engine-script"]
protocol-assertion = ["dep:flow-engine-assertion"]
protocol-tcp = ["dep:flow-engine-tcp"]
protocol-sse = ["dep:flow-engine-sse"]
protocol-graphql = ["dep:flow-engine-graphql"]
# Plugin manager feature — independent of protocol-*; the sidecar plugin
# system is not a protocol executor.
plugin-manager = ["dep:flow-engine-plugin"]

[dependencies]
flow-engine-core = { path = "../flow-engine-core" }
flow-engine-http = { path = "../flow-engine-http", optional = true }
flow-engine-ws = { path = "../flow-engine-ws", optional = true }
flow-engine-script = { path = "../flow-engine-script", optional = true }
flow-engine-assertion = { path = "../flow-engine-assertion", optional = true }
flow-engine-tcp = { path = "../flow-engine-tcp", optional = true }
flow-engine-sse = { path = "../flow-engine-sse", optional = true }
flow-engine-graphql = { path = "../flow-engine-graphql", optional = true }
flow-engine-plugin = { path = "../flow-engine-plugin", optional = true }
async-trait = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
tokio = { workspace = true }
chrono = { workspace = true }
uuid = { workspace = true }
evalexpr = "11.0.0"
regex = { workspace = true }
log = { workspace = true }
jsonpath-rust = { workspace = true }
thiserror = { workspace = true }
tempfile = "3.0"
csv = "1.3"
encoding_rs = "0.8"
chardetng = "0.1"
rand = "0.8"
workspace-hack = { version = "0.1", path = "../workspace-hack" }

[dev-dependencies]
mockito = "1.0"
wiremock = "0.6"
proptest = "1.4"
futures-util = { workspace = true }
rustls = { workspace = true }

[lints]
workspace = true
