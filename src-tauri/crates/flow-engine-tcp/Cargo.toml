[package]
name = "flow-engine-tcp"
version = "0.1.0"
edition = "2021"

[dependencies]
flow-engine-core = { path = "../flow-engine-core" }
async-trait = { workspace = true }
tokio = { workspace = true, features = ["net", "io-util", "time", "sync", "rt-multi-thread"] }
serde = { workspace = true }
serde_json = { workspace = true }
log = { workspace = true }
chrono = { workspace = true }
thiserror = { workspace = true }
base64 = "0.22"
hex = "0.4"
socket2 = "0.5"

# TLS 依赖（支持 TLS 加密连接）
rustls = { version = "0.23", default-features = false, features = ["ring", "logging", "tls12"] }
tokio-rustls = { version = "0.26", default-features = false, features = ["logging", "tls12", "ring"] }
webpki-roots = "0.26"
rustls-pemfile = "2"

[dev-dependencies]
tempfile = "3"

[lints]
workspace = true
