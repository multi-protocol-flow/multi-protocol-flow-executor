[package]
name = "flow-engine"
version = "0.1.0"
edition = "2021"

[dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
reqwest = { version = "0.12", features = ["json", "multipart", "stream"] }
evalexpr = "11.0.0"
regex = "1.10"
async-trait = "0.1"
tokio = { version = "1", features = ["full"] }
chrono = "0.4"
uuid = { version = "1.0", features = ["v4", "serde"] }
mime_guess = "2.0"
tempfile = "3.0"
serde_json_path = "0.7"
log = "0.4"
tokio-tungstenite = { version = "0.28", features = ["native-tls"] }
futures-util = "0.3"

[dev-dependencies]
mockito = "1.0"
wiremock = "0.6"
proptest = "1.4"
assert_cmd = "2.0"
predicates = "3"

[lints.rust]
unsafe_code = "forbid"

[lints.clippy]
all = { level = "warn", priority = -1 }
correctness = { level = "deny", priority = -1 }
