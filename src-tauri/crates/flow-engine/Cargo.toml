[package]
name = "flow-engine"
version = "0.1.0"
edition = "2021"

[features]
default = ["all-protocols", "plugin-manager"]
all-protocols = [
    "protocol-http",
    "protocol-db",
    "protocol-ws",
    "protocol-script",
    "protocol-assertion",
    "protocol-grpc",
    "protocol-mcp",
    "protocol-tcp",
    "protocol-mqtt",
    "protocol-kafka",
    "protocol-sse",
    "protocol-graphql",
    "protocol-amqp",
    "protocol-smtp",
    "protocol-imap",
    "protocol-redis",
]
protocol-http = ["flow-engine-executor/protocol-http"]
protocol-db = ["flow-engine-executor/protocol-db"]
protocol-ws = ["flow-engine-executor/protocol-ws"]
protocol-script = ["flow-engine-executor/protocol-script"]
protocol-assertion = ["flow-engine-executor/protocol-assertion"]
protocol-grpc = ["flow-engine-executor/protocol-grpc"]
protocol-mcp = ["flow-engine-executor/protocol-mcp"]
protocol-tcp = ["flow-engine-executor/protocol-tcp"]
protocol-mqtt = ["flow-engine-executor/protocol-mqtt"]
protocol-kafka = ["flow-engine-executor/protocol-kafka"]
protocol-sse = ["flow-engine-executor/protocol-sse"]
protocol-graphql = ["flow-engine-executor/protocol-graphql"]
protocol-amqp = ["flow-engine-executor/protocol-amqp"]
protocol-smtp = ["flow-engine-executor/protocol-smtp"]
protocol-imap = ["flow-engine-executor/protocol-imap"]
protocol-redis = ["flow-engine-executor/protocol-redis"]
# Plugin manager — independent of protocol-*; explicitly re-forwards the
# executor feature because the facade depends on executor with
# default-features = false (the executor feature would otherwise never
# activate through this path).
plugin-manager = ["dep:flow-engine-plugin", "flow-engine-executor/plugin-manager"]

[dependencies]
# 子 crate 依赖（facade 只做 re-export）
flow-engine-core = { path = "../flow-engine-core" }
flow-engine-crypto = { path = "../flow-engine-crypto" }
flow-engine-executor = { path = "../flow-engine-executor", default-features = false }
flow-engine-plugin = { path = "../flow-engine-plugin", optional = true }

# facade 自身代码需要的最小依赖（仅用于 re-export 类型的序列化边界）
serde = { workspace = true }
serde_json = { workspace = true }
workspace-hack = { version = "0.1", path = "../workspace-hack" }

[dev-dependencies]
tokio = { workspace = true }
mockito = "1.0"
wiremock = "0.6"
proptest = "1.4"
assert_cmd = "2.0"
predicates = "3"
futures-util = { workspace = true }

[lints]
workspace = true
