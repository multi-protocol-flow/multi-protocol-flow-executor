[package]
name = "flow-engine"
version = "0.1.0"
edition = "2021"

[dependencies]
# 子 crate 依赖（facade 只做 re-export）
flow-engine-core = { path = "../flow-engine-core" }
flow-engine-crypto = { path = "../flow-engine-crypto" }
flow-engine-http = { path = "../flow-engine-http" }
flow-engine-db = { path = "../flow-engine-db" }
flow-engine-script = { path = "../flow-engine-script" }
flow-engine-assertion = { path = "../flow-engine-assertion" }
flow-engine-ws = { path = "../flow-engine-ws" }
flow-engine-grpc = { path = "../flow-engine-grpc" }
flow-engine-mcp = { path = "../flow-engine-mcp" }
flow-engine-tcp = { path = "../flow-engine-tcp" }
flow-engine-mqtt = { path = "../flow-engine-mqtt" }
flow-engine-kafka = { path = "../flow-engine-kafka" }
flow-engine-sse = { path = "../flow-engine-sse" }
flow-engine-graphql = { path = "../flow-engine-graphql" }
flow-engine-amqp = { path = "../flow-engine-amqp" }
flow-engine-imap = { path = "../flow-engine-imap" }
flow-engine-smtp = { path = "../flow-engine-smtp" }
flow-engine-redis = { path = "../flow-engine-redis" }
flow-engine-executor = { path = "../flow-engine-executor" }

# facade 自身代码需要的最小依赖（仅用于 re-export 类型的序列化边界）
serde = { workspace = true }
serde_json = { workspace = true }
workspace-hack = { version = "0.1", path = "../workspace-hack" }

[dev-dependencies]
tokio = { workspace = true }
mockito = "1.0"
wiremock = "0.6"
proptest = "1.4"
assert_cmd = "2.0"
predicates = "3"
futures-util = { workspace = true }

[lints]
workspace = true
