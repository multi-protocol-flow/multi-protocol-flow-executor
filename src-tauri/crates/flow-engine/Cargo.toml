[package]
name = "flow-engine"
version = "0.1.0"
edition = "2021"

[dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
reqwest = { version = "0.12", features = ["json", "multipart", "stream"] }
evalexpr = "11.0.0"
regex = "1.10"
async-trait = "0.1"
tokio = { version = "1", features = ["full"] }
chrono = "0.4"
uuid = { version = "1.0", features = ["v4", "serde"] }
mime_guess = "2.0"
tempfile = "3.0"
serde_json_path = "0.7"
jsonpath-rust = "1.0.4"
log = "0.4"
tokio-tungstenite = { version = "0.28", features = ["native-tls"] }
futures-util = "0.3"

# HTTP 计时功能依赖（hyper 1.x + HTTP/2 支持）
hyper = { version = "1.6", features = ["client", "http1", "http2"] }
hyper-util = { version = "0.1", features = ["client", "client-legacy", "http1", "http2", "tokio"] }
http = "1.3"
http-body-util = "0.1"
tower-service = "0.3"
bytes = "1.10"
tokio-rustls = "0.26"
rustls = "0.23"
rustls-pki-types = "1"
webpki-roots = "0.26"
url = "2.5"
thiserror = "1.0"

# 加密模块依赖
aes-gcm = { version = "0.10", features = ["std"] }
keyring = "3"
zeroize = "1"
base64 = "0.22"
rand = "0.8"
once_cell = "1"

# JS 运行时 (rquickjs POC)
# 注意: Windows MSVC 有预编译绑定，不需要 bindgen feature
rquickjs = { version = "0.7", features = ["chrono", "array-buffer"] }

[dev-dependencies]
mockito = "1.0"
wiremock = "0.6"
proptest = "1.4"
assert_cmd = "2.0"
predicates = "3"

[lints.rust]
unsafe_code = "forbid"

[lints.clippy]
all = { level = "warn", priority = -1 }
correctness = { level = "deny", priority = -1 }
