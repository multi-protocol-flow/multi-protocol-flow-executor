[package]
name = "flow-engine-imap"
version = "0.1.0"
edition = "2021"

[dependencies]
flow-engine-core = { path = "../flow-engine-core" }
flow-engine-crypto = { path = "../flow-engine-crypto" }
# IMAP 客户端（runtime-tokio 特性）
async-imap = { version = "0.11", default-features = false, features = ["runtime-tokio"] }
# MIME 解析（IMAP fetch 结果解析）
mail-parser = "0.11"
# TLS 依赖（自定义 TLS 配置，支持 skip_verify）
rustls = { workspace = true, features = ["logging", "tls12"] }
webpki-roots = { workspace = true }
tokio-rustls = { workspace = true }
# Workspace 共享依赖
async-trait = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
tokio = { workspace = true }
log = { workspace = true }
thiserror = { workspace = true }
uuid = { workspace = true }
base64 = { workspace = true }
futures-util = { workspace = true }
workspace-hack = { version = "0.1", path = "../workspace-hack" }

[lints]
workspace = true
