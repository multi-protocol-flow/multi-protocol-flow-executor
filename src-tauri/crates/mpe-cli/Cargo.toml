[package]
name = "mpe-cli"
version = "0.3.0-beta.1"
description = "Multi-Protocol Executor CLI — standalone binary without GUI dependencies"
edition = "2021"
rust-version = "1.82.0"
default-run = "mpe-cli"

[[bin]]
name = "mpe-cli"
path = "src/main.rs"

[lib]
name = "mpe_cli"
crate-type = ["lib"]

[dependencies]
# 业务逻辑引擎
flow-engine = { path = "../flow-engine", default-features = false }

# CLI 框架
clap = { version = "4", features = ["derive"] }
tokio = { workspace = true, features = ["signal"] }
serde = { workspace = true }
serde_json = { workspace = true }
reqwest = { workspace = true }
chrono = { workspace = true }
log = { workspace = true }
fern = { version = "0.7", default-features = false }
uuid = { workspace = true }
toml = "0.8"
rustls = { workspace = true, features = ["ring"] }
workspace-hack = { version = "0.1", path = "../workspace-hack" }

# 协议特性开关
[features]
default = ["all-protocols", "plugin-manager"]
all-protocols = [
    "flow-engine/all-protocols",
]
protocol-http = ["flow-engine/protocol-http"]
protocol-ws = ["flow-engine/protocol-ws"]
protocol-script = ["flow-engine/protocol-script"]
protocol-assertion = ["flow-engine/protocol-assertion"]
protocol-tcp = ["flow-engine/protocol-tcp"]
protocol-sse = ["flow-engine/protocol-sse"]
protocol-graphql = ["flow-engine/protocol-graphql"]
# Proves the CLI gets plugins despite `default-features = false` on its
# flow-engine dependency: plugin-manager is forwarded explicitly and is
# independent of protocol-*.
plugin-manager = ["flow-engine/plugin-manager"]

[dev-dependencies]
tempfile = "3.0"

[lints]
workspace = true
