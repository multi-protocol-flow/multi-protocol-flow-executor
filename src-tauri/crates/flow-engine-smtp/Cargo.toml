[package]
name = "flow-engine-smtp"
version = "0.1.0"
edition = "2021"

[dependencies]
flow-engine-core = { path = "../flow-engine-core" }
flow-engine-crypto = { path = "../flow-engine-crypto" }
# SMTP 客户端 — 使用 ring 后端（保持与项目一致），不使用 aws-lc-rs
lettre = { workspace = true }
# TLS 依赖（自定义 TLS 配置，支持 skip_verify）
rustls = { workspace = true, features = ["logging", "tls12"] }
webpki-roots = { workspace = true }
# HTTP 客户端（OAuth2 token 交换、Device Flow）
reqwest = { version = "0.13", default-features = false, features = ["json", "form"] }
# 随机数（CSRF state、PKCE verifier）
rand = "0.8"
# SHA-256（PKCE challenge）
sha2 = "0.10"
# Base64 URL 编码（PKCE）
base64 = { workspace = true }
# Workspace 共享依赖
async-trait = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
tokio = { workspace = true }
log = { workspace = true }
thiserror = { workspace = true }
workspace-hack = { version = "0.1", path = "../workspace-hack" }

[lints]
workspace = true
