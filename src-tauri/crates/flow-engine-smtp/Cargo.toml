[package]
name = "flow-engine-smtp"
version = "0.1.0"
edition = "2021"

[dependencies]
flow-engine-core = { path = "../flow-engine-core" }
flow-engine-crypto = { path = "../flow-engine-crypto" }
# SMTP 客户端 — 使用 ring 后端（保持与项目一致），不使用 aws-lc-rs
lettre = { workspace = true }
# TLS 依赖（自定义 TLS 配置，支持 skip_verify）
rustls = { version = "0.23", default-features = false, features = ["ring", "logging", "tls12"] }
webpki-roots = "0.26"
# OAuth2 客户端
oauth2 = "4"
# HTTP 客户端（OAuth2 token 交换、Device Flow）
reqwest = { version = "0.12", features = ["json"] }
# 随机数（CSRF state、PKCE verifier）
rand = "0.8"
# SHA-256（PKCE challenge）
sha2 = "0.10"
# Base64 URL 编码（PKCE）
base64 = "0.22"
# Workspace 共享依赖
async-trait = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
tokio = { workspace = true }
log = { workspace = true }
thiserror = { workspace = true }
chrono = { workspace = true }
uuid = { workspace = true }

[lints]
workspace = true
