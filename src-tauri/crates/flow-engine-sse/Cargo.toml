[package]
name = "flow-engine-sse"
version = "0.1.0"
edition = "2021"
description = "Server-Sent Events node executors"
license.workspace = true
repository.workspace = true
authors.workspace = true

[dependencies]
flow-engine-core = { path = "../flow-engine-core" }
# SSE 使用 reqwest 流式 GET（无需额外 SSE 库）
reqwest = { version = "0.13", default-features = false, features = ["stream", "rustls-no-provider"] }
# Workspace 共享依赖
async-trait = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
tokio = { workspace = true }
log = { workspace = true }
thiserror = { workspace = true }
chrono = { workspace = true }
futures-util = { workspace = true }
tokio-util = "0.7"
rustls = { workspace = true, features = ["ring"] }
workspace-hack = { version = "0.1", path = "../workspace-hack" }

[lints]
workspace = true
