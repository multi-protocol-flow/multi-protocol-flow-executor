[package]
name = "flow-engine-sse"
version = "0.1.0"
edition = "2021"

[dependencies]
flow-engine-core = { path = "../flow-engine-core" }
# SSE 使用 reqwest 流式 GET（无需额外 SSE 库）
reqwest = { version = "0.13", default-features = false, features = ["stream"] }
# Workspace 共享依赖
async-trait = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
tokio = { workspace = true }
log = { workspace = true }
thiserror = { workspace = true }
chrono = { workspace = true }
uuid = { workspace = true }
futures-util = "0.3"
tokio-util = "0.7"

[lints]
workspace = true
